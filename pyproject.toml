[project]
name = "eagle-ocr"
version = "0.1.0"
description = "常驻 PaddleOCR HTTP 服务（模型只加载一次），供 eagle_eye 识别图片文字"
readme = "README.md"
requires-python = ">=3.11"
# 核心只依赖 Pillow：HTTP 层是标准库，PaddleOCR 在加载时才导入，测试不需要它。
dependencies = ["pillow>=10"]

[project.optional-dependencies]
# 推理引擎二选一：cpu 或 gpu，不要同时装（两个 wheel 都提供 paddle 模块，会互相覆盖）。
cpu = ["paddleocr>=3.7,<3.8", "paddlepaddle>=3.3,<3.4"]
# NVIDIA GPU（CUDA 12.6 构建，自带 CUDA/cuDNN 运行库 wheel，只需要宿主机驱动）。
# paddlepaddle-gpu 不在 PyPI，靠下面的 [tool.uv.sources] 从飞桨官方 cu126 源取。
gpu = ["paddleocr>=3.7,<3.8", "paddlepaddle-gpu>=3.3,<3.4"]

[project.scripts]
eagle-ocr = "eagle_ocr.cli:main"

[tool.uv]
# 两个 extra 互斥，让 uv lock / uv sync 不尝试把它们解在一起。
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[[tool.uv.index]]
# explicit = true：这个源只用来取 paddlepaddle-gpu，其余依赖照常走 PyPI。
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eagle_ocr"]
