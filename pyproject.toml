[project]
name = "eagle-ocr"
version = "0.1.0"
description = "常驻 PaddleOCR HTTP 服务（模型只加载一次），供 eagle_eye 识别图片文字"
readme = "README.md"
requires-python = ">=3.11"
# 核心只依赖 Pillow：HTTP 层是标准库，PaddleOCR 在加载时才导入，测试不需要它。
dependencies = ["pillow>=10"]

[project.optional-dependencies]
# CPU 推理引擎。GPU 版不要装这个 extra，见 README「GPU」一节。
cpu = ["paddleocr>=3.7,<3.8", "paddlepaddle>=3.3,<3.4"]

[project.scripts]
eagle-ocr = "eagle_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eagle_ocr"]
